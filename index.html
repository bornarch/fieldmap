<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>강남·서초·광진·송파 위반건축물 지도 · 현장용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* claude.ai 배포용 지도를 옮긴 현장용 지도: GPS 내 위치 + 구글시트 동기화 */
:root{
  --bg:#f4f5f2; --panel:#ffffff; --ink:#1d2421; --muted:#68716c; --line:#dfe3dd;
  --bldg:#cfd4cc; --viol:#b3abc2; --unc:#6d93bf; --gA:#d62418; --gB:#f07a10; --gC:#f2c400; --focus:#1f5f8b; --sel:#1f5f8b; --done:#14803c;
  --road:#4f5a63; --roadbg:#e4e0d3; --me:#1a73e8;
  --font-display:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141816; --panel:#1c211f; --ink:#e7ebe7; --muted:#9aa39e; --line:#2e3532;
    --bldg:#3a423e; --viol:#6b6480; --unc:#5f86b3; --gA:#ff5a48; --gB:#ff9a3c; --gC:#ffd84a; --focus:#7cb8e2; --sel:#7cb8e2; --done:#3fcf72;
    --road:#a3adb5; --roadbg:#262d2a; --me:#5aa2ff;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;display:grid;grid-template-columns:340px minmax(0,1fr);overflow:hidden;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/3;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-family:var(--font-display);font-size:18px;font-weight:700;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="false"]{opacity:.45}
.chip i{width:10px;height:10px;border-radius:2px;display:inline-block}
.chip:focus-visible,button:focus-visible,.dong:focus-visible,.cand:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto;min-height:0;min-width:0;display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;padding:12px 12px 8px;position:sticky;top:0;background:var(--panel);z-index:1}
.tab{flex:1;padding:8px 4px;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.gusum{padding:2px 14px 8px;color:var(--muted);font-size:12.5px}
.dongs{list-style:none;margin:0;padding:0 8px}
.dong{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer}
.dong:hover{background:var(--bg)}
.dong[aria-current="true"]{background:var(--bg);box-shadow:inset 3px 0 0 var(--sel)}
.dong b{font-weight:600}
.bar{height:8px;border-radius:2px;background:var(--line);display:flex;overflow:hidden}
.bar span{display:block;height:100%}
.num{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.num strong{color:var(--ink)}
.detail{border-top:1px solid var(--line);margin-top:8px;padding:12px 14px 16px;display:flex;flex-direction:column;gap:8px;min-height:0}
.detail h2{font-family:var(--font-display);font-size:15px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer}
.btn.primary{background:var(--sel);border-color:var(--sel);color:#fff}
.cands{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cand{display:grid;grid-template-columns:8px 1fr auto;gap:8px;align-items:start;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.cand:hover{background:var(--bg)}
.cand .dot{width:8px;height:8px;border-radius:50%;margin-top:6px}
.cand .a{font-variant-numeric:tabular-nums}
.cand .m{color:var(--muted);font-size:12px}
.note{color:var(--muted);font-size:12px}
main{position:relative;min-height:0;min-width:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
.zoom .btn{width:40px;height:40px;padding:0;font-size:18px;background:var(--panel)}
.zoom .btn.gps[aria-pressed="true"]{background:var(--me);border-color:var(--me);color:#fff}
.scale{position:absolute;left:12px;bottom:12px;font-size:11.5px;color:var(--muted);background:var(--panel);padding:4px 8px;border-radius:6px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.scale div{height:4px;border:1px solid var(--muted);border-top:none;margin-top:2px}
.card{position:absolute;width:340px;max-width:calc(100% - 16px);max-height:calc(100% - 16px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:13px;display:none}
.card h3{margin:0 0 2px;font-family:var(--font-display);font-size:14.5px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0}
.card dt{color:var(--muted)}
.card dd{margin:0;font-variant-numeric:tabular-nums}
.card .x{position:absolute;right:6px;top:4px;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;width:36px;height:36px}
.card a{color:var(--focus)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;color:#fff}
.pill.gC{color:#3a3000}
.ck{width:30px;height:30px;margin:-2px 0;border:2px solid var(--muted);border-radius:6px;background:var(--panel);color:#fff;font:700 18px/1 system-ui,sans-serif;cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.ck[aria-checked="true"]{background:var(--done);border-color:var(--done)}
.ck[aria-checked="true"]::after{content:"✓"}
.ckrow{display:flex;align-items:center;gap:10px;margin:10px 0 2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-weight:600;width:100%;color:var(--ink);font-family:inherit;font-size:13.5px;text-align:left}
.ckrow .when{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
.cand.done .a{color:var(--muted)}
.cand .at{color:var(--done);font-size:11.5px;font-weight:600}
.seg{flex:none;display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:6px 8px;border:0;background:var(--bg);color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.sync{margin:0 12px 6px;padding:6px 10px;border-radius:8px;background:var(--bg);font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync.on{color:var(--done);font-weight:600}
.sync.err{color:var(--gA);font-weight:600}
.sync button{margin-left:auto}
.card .sec{margin:6px 0 0;padding-top:6px;border-top:1px solid var(--line)}
.card .sec b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.card .sec p{margin:2px 0 0;font-size:12.5px;line-height:1.55}
.sym{font-weight:700;font-size:15px;margin-right:4px}
.cand .g{font-weight:700;font-size:11.5px;margin-left:4px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:6px;font-size:13px;display:none;max-width:90%;text-align:center}
.gate{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:10;padding:16px}
.gate form{background:var(--panel);border-radius:12px;padding:20px;width:min(360px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.gate h2{margin:0;font-family:var(--font-display);font-size:17px}
.gate label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.gate input{font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.gate .err{color:var(--gA);font-size:13px;min-height:1.2em;margin:0}
.gate button{padding:12px;font-size:15px}
@media (max-width:760px){
  body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 58vh minmax(0,1fr)}
  header{grid-column:1;padding:8px 12px;flex-wrap:nowrap;flex-direction:column;align-items:stretch;gap:6px}
  header>div:first-child{min-width:0}
  h1{font-size:16px}
  .sub{display:none}
  main{grid-row:2}
  aside{grid-row:3;border-right:0;border-top:1px solid var(--line)}
  .legend{margin-left:0;flex-wrap:nowrap;overflow-x:auto;max-width:100%;min-width:0;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .chip{flex:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div>
    <h1>강남·서초·광진·송파 위반건축물 지도 · 현장용</h1>
    <div class="sub">국토교통부 GIS건물통합정보 2026-11-09 기준 · 대장 확인·배포 체크는 구글시트와 1분마다 동기화 · 도로중심선: 국토지리정보원 연속수치지형도(1:5,000) · 지하철역: 서울시 역사마스터 정보 · 출구: © OpenStreetMap 기여자(ODbL)</div>
  </div>
  <div class="legend" role="group" aria-label="표시할 건물">
    <button class="chip" id="t5" aria-pressed="true"><i style="background:var(--gA)"></i>A등급 (80점↑)</button>
    <button class="chip" id="t4" aria-pressed="true"><i style="background:var(--gB)"></i>B등급 (65~79)</button>
    <button class="chip" id="t3" aria-pressed="true"><i style="background:var(--gC)"></i>C등급 (64↓)</button>
    <button class="chip" id="t2" aria-pressed="true"><i style="background:var(--unc)"></i>대장 미확인 후보</button>
    <button class="chip" id="t1" aria-pressed="true"><i style="background:var(--viol)"></i>기타 위반</button>
    <button class="chip" id="t0" aria-pressed="true"><i style="background:var(--bldg)"></i>일반 건물</button>
    <button class="chip" id="tR" aria-pressed="true"><i style="background:var(--road);height:3px;border-radius:0"></i>도로중심선</button>
    <button class="chip" id="tS" aria-pressed="true"><i style="background:#fff;border:2px solid #00A84D;border-radius:50%"></i>지하철역·출구</button>
  </div>
</header>
<aside>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="gu0" aria-selected="false">강남구</button>
    <button class="tab" role="tab" id="gu1" aria-selected="true">서초구</button>
    <button class="tab" role="tab" id="gu2" aria-selected="false">광진구</button>
    <button class="tab" role="tab" id="gu3" aria-selected="false">송파구</button>
  </div>
  <div class="sync" id="sync"><span id="synct">구글시트에 연결하는 중…</span><button class="btn" id="who" type="button">이름 변경</button></div>
  <div class="gusum" id="gusum"></div>
  <ul class="dongs" id="dongs"></ul>
  <section class="detail" id="detail"></section>
</aside>
<main>
  <canvas id="map" aria-label="건물 외곽선 지도"></canvas>
  <div class="loading" id="loading">건물 외곽선을 불러오는 중…</div>
  <div class="zoom">
    <button class="btn gps" id="gps" aria-pressed="false" aria-label="내 위치" title="내 위치">◎</button>
    <button class="btn" id="zin" aria-label="확대">+</button>
    <button class="btn" id="zout" aria-label="축소">−</button>
    <button class="btn" id="zfit" aria-label="선택한 구 전체 보기" style="font-size:12px">전체</button>
  </div>
  <div class="scale" id="scale"><span id="scalet"></span><div id="scaleb"></div></div>
  <div class="card" id="card" role="dialog" aria-label="건물 정보"></div>
  <div class="toast" id="toast" role="status"></div>
</main>
<div class="gate" id="gate">
  <form id="gateform" autocomplete="on">
    <h2>현장용 지도 접속</h2>
    <p class="note" style="margin:0">사무실에서 받은 접속 비밀번호와 본인 이름을 넣어 주세요. 이 휴대폰에 기억됩니다.</p>
    <label>접속 비밀번호<input id="gpw" type="password" autocomplete="current-password" required></label>
    <label>이름 (배포 체크에 함께 남습니다)<input id="gby" type="text" autocomplete="name" maxlength="20"></label>
    <p class="err" id="gerr"></p>
    <button class="btn primary" type="submit">들어가기</button>
  </form>
</div>
<script src="config.js"></script>
<script>
(async function(){
const $=id=>document.getElementById(id);
const cv=$('map'), ctx=cv.getContext('2d');
const API=(window.SHEET_API||'').trim();
// ---------- 저장값 ----------
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
let PW=store.get('fieldmap-pw',''), BY=store.get('fieldmap-by','');
// ---------- 기본 지도: 지역별로 나눠 불러옴 (강남·서초 / 광진·송파). 공개 자료: 건물 외곽선·위반 여부·동 ----------
const GU=['강남구','서초구','광진구','송파구'];
const REG=[{file:'map.json',roads:'roads.json',base:0,n:53145,guBase:0,dongBase:0,bbox:[0,0,12738,11546]},
           {file:'map_ks.json',roads:'roads_ks.json',base:53145,n:54774,guBase:2,dongBase:24,bbox:[7000,-4137,15992,7487]}];
const N=REG.reduce((s,r)=>s+r.n,0);
const POLY=new Array(N), BD=new Int16Array(N).fill(-1), baseCat=new Uint8Array(N), cat=new Uint8Array(N);
const bx0=new Float32Array(N),by0=new Float32Array(N),bx1=new Float32Array(N),by1=new Float32Array(N),cx=new Float32Array(N),cy=new Float32Array(N);
const regOfB=b=>b>=REG[1].base?REG[1]:REG[0];
const regOfGu=g=>g<2?REG[0]:REG[1];
const isLoaded=b=>!!regOfB(b).loaded;
const show=[true,true,true,true,true,true];
const dongs=[]; const allDongs=()=>dongs.filter(Boolean);
function pathOfReg(r,filter){const P=new Path2D();for(let i=r.base;i<r.base+r.n;i++){if(!filter(i))continue;const p=POLY[i];P.moveTo(p[0],p[1]);for(let j=2;j<p.length;j+=2)P.lineTo(p[j],p[j+1]);P.lineTo(p[0],p[1]);}return P;}
function pathOf(filter){const P=new Path2D();for(const r of REG)if(r.loaded)P.addPath(pathOfReg(r,filter));return P;}
function loadRegion(r){
  if(r.loaded)return Promise.resolve();
  if(r.loading)return r.loading;
  r.loading=(async()=>{
    let D;
    try{D=await (await fetch(r.file,{cache:'no-cache'})).json();}catch(e){r.loading=null;toast('지도 자료를 읽지 못했습니다. 신호를 확인하고 다시 시도해 주세요.');throw e;}
    r.nd=D.dongs.length;
    D.dongs.forEach((name,k)=>{dongs[r.dongBase+k]={k:r.dongBase+k,name,gu:-1,n:0,v:0,c:[0,0,0,0,0,0],x0:1e9,y0:1e9,x1:-1e9,y1:-1e9,sx:0,sy:0};});
    for(let j=0;j<r.n;j++){const i=r.base+j,p=D.polys[j];POLY[i]=p;let a=1e9,b=1e9,c=-1e9,d=-1e9,sx=0,sy=0;for(let q=0;q<p.length;q+=2){const x=p[q],y=p[q+1];if(x<a)a=x;if(y<b)b=y;if(x>c)c=x;if(y>d)d=y;sx+=x;sy+=y;}bx0[i]=a;by0[i]=b;bx1[i]=c;by1[i]=d;const n=p.length/2;cx[i]=sx/n;cy[i]=sy/n;
      BD[i]=r.dongBase+D.dong[j];baseCat[i]=D.cat[j]?1:0;const dd=dongs[BD[i]];dd.gu=r.guBase+D.gu[j];dd.n++;dd.x0=Math.min(dd.x0,a);dd.y0=Math.min(dd.y0,b);dd.x1=Math.max(dd.x1,c);dd.y1=Math.max(dd.y1,d);dd.sx+=cx[i];dd.sy+=cy[i];}
    D.dongs.forEach((_,k)=>{const dd=dongs[r.dongBase+k];dd.lx=dd.sx/dd.n;dd.ly=dd.sy/dd.n;});
    r.loaded=true;
    for(const c of C)if(regOfB(c.b)===r)c.dong=BD[c.b];
    applyCats(r);rebuildDist();renderList();renderDetail();draw();
    fetch(r.roads).then(x=>x.ok?x.json():null).then(a=>{if(!Array.isArray(a))return;const bw=new Map(),ln=[new Path2D(),new Path2D(),new Path2D(),new Path2D()];for(const q of a){const w=q[0];let x=q[1],y=q[2];const L=ln[w>=20?0:w>=10?1:w>=6?2:3];let B=bw.get(w);if(!B){B=new Path2D();bw.set(w,B);}L.moveTo(x,y);B.moveTo(x,y);for(let j=3;j<q.length;j+=2){x+=q[j];y+=q[j+1];L.lineTo(x,y);B.lineTo(x,y);}}r.roadBand=[...bw.entries()].filter(e=>e[0]>=2);r.roadLine=ln;draw();}).catch(()=>{});
  })();
  return r.loading;
}
// 건물 분류: 0 일반, 1 기타 위반 (공개 자료). 후보(2~5)는 시트에서 받은 뒤 덮어씀
function applyCats(r){
  if(!r.loaded)return;
  for(let i=r.base;i<r.base+r.n;i++)cat[i]=baseCat[i];
  for(const c of C)if(regOfB(c.b)===r)cat[c.b]=catOf(c);
  r.paths=[0,1,2,3,4,5].map(k=>pathOfReg(r,i=>cat[i]===k));
  for(let k=r.dongBase;k<r.dongBase+(r.nd||0);k++){const d=dongs[k];if(d){d.v=0;d.c=[0,0,0,0,0,0];}}
  for(let i=r.base;i<r.base+r.n;i++){const d=dongs[BD[i]];if(cat[i]>0)d.v++;d.c[cat[i]]++;}
}
// ---------- 후보 (시트에서 받음, 비밀번호 필요) ----------
let C=[], byKey=new Map(), candByB=new Map(), candVer='';
const SYM={'○':'거주','△':'애매','✕':'비거주'};
const catOf=c=>c.L?({A:5,B:4,C:3}[c.L.g]||2):2;
const gvar=c=>c.L?'--g'+c.L.g:'--unc';
function setCands(rows){

  for(const d of allDongs()){const x=d.lx*k+tx,y=d.ly*k+ty;if(x<0||y<0||x>W||y>H)continue;ctx.lineWidth=4;ctx.strokeStyle=css('--bg');ctx.strokeText(d.name,x,y);ctx.fillStyle=css('--ink');ctx.fillText(d.name,x,y);}
  drawExits();
  drawStations();
  drawMe();
  const target=W*0.18/k;const steps=[20,50,100,200,500,1000,2000];let m=steps[0];for(const s of steps)if(s<=target)m=s;$('scalet').textContent=m>=1000?(m/1000)+' km':m+' m';$('scaleb').style.width=(m*k)+'px';
}
// ---------- 목록 ----------
function renderList(){
  const list=allDongs().filter(d=>d.gu===curGu).sort((a,b)=>(b.c[5]*1e6+b.c[4]*1e4+b.c[3]*100+b.c[2])-(a.c[5]*1e6+a.c[4]*1e4+a.c[3]*100+a.c[2]));const max=Math.max(1,...list.map(d=>d.v));
  const T=list.reduce((s,d)=>({n:s.n+d.n,v:s.v+d.v,A:s.A+d.c[5],B:s.B+d.c[4],Cg:s.Cg+d.c[3],u:s.u+d.c[2]}),{n:0,v:0,A:0,B:0,Cg:0,u:0});
  if(!regOfGu(curGu).loaded){$('gusum').textContent=GU[curGu]+' 건물 외곽선을 불러오는 중…';$('dongs').innerHTML='';return;}
  $('gusum').innerHTML=C.length?`건물 ${T.n.toLocaleString()}동 · 위반 ${T.v.toLocaleString()}동 · 대장 확인 <strong>A ${T.A} · B ${T.B} · C ${T.Cg}</strong> · 미확인 후보 ${T.u.toLocaleString()} · 배포 완료 ${C.filter(c=>isDone(c)&&c.dong>=0&&dongs[c.dong]&&dongs[c.dong].gu===curGu).length}곳`:'후보 건물은 접속 비밀번호를 넣은 뒤에 보입니다.';
  $('dongs').innerHTML=list.map(d=>`<li class="dong" tabindex="0" data-k="${d.k}" ${curDong===d.k?'aria-current="true"':''}><b>${esc(d.name)}</b><div class="bar" title="A ${d.c[5]}, B ${d.c[4]}, C ${d.c[3]}, 미확인 후보 ${d.c[2]}, 기타 위반 ${d.c[1]}"><span style="width:${d.c[5]/max*100}%;background:var(--gA)"></span><span style="width:${d.c[4]/max*100}%;background:var(--gB)"></span><span style="width:${d.c[3]/max*100}%;background:var(--gC)"></span><span style="width:${d.c[2]/max*100}%;background:var(--unc)"></span><span style="width:${d.c[1]/max*100}%;background:var(--viol)"></span></div><span class="num">${d.c[5]+d.c[4]+d.c[3]?`<strong>${d.c[5]}·${d.c[4]}·${d.c[3]}</strong> · `:''}후보 ${d.c[2]}</span></li>`).join('');
  document.querySelectorAll('.dong').forEach(el=>{const go=()=>selectDong(+el.dataset.k);el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});
}
function visibleCands(dk){return C.filter(c=>c.dong===dk&&show[catOf(c)]&&(distFilter==='all'||(distFilter==='done')===isDone(c))).sort((a,b)=>(b.L?+b.L.sc:-1)-(a.L?+a.L.sc:-1)||a.tier.localeCompare(b.tier)||a.addr.localeCompare(b.addr,'ko',{numeric:true}));}
const HELP='<p class="note">동을 고르면 그 동의 후보 지번 목록이 영업 점수 순으로 나옵니다. 지도에서 색칠된 건물을 누르면 위반 상세, 소유자 거주(○ 거주 · △ 애매 · ✕ 비거주), 최근 적발연도가 뜹니다. 네모를 누르면 배포 완료로 표시되고 구글시트에 기록됩니다. ◎ 버튼은 내 위치입니다.</p>';
function renderDetail(){
  if(curDong===null){$('detail').innerHTML=HELP;return;}
  const d=dongs[curDong],L=visibleCands(curDong);
  $('detail').innerHTML=`<h2>${GU[d.gu]} ${esc(d.name)}</h2><div class="note">대장 확인 A ${d.c[5]} · B ${d.c[4]} · C ${d.c[3]} · 미확인 후보 ${d.c[2]}. 목록은 켜 둔 종류만 보여 줍니다. 배포 완료 ${C.filter(c=>c.dong===curDong&&isDone(c)).length}곳.</div><div class="seg" role="group" aria-label="배포 여부로 거르기"><button data-f="all" aria-pressed="${distFilter==='all'}">전체</button><button data-f="todo" aria-pressed="${distFilter==='todo'}">미배포만</button><button data-f="done" aria-pressed="${distFilter==='done'}">배포 완료만</button></div><div class="row"><button class="btn primary" id="copy">주소 ${L.length}건 복사</button><button class="btn" id="clr">동 선택 해제</button></div><ul class="cands">${L.map(c=>`<li class="cand${isDone(c)?' done':''}" tabindex="0" data-key="${c.key}"><span class="dot" style="background:var(${gvar(c)})"></span><div><div class="a">${esc(c.addr.replace(/^\S+\s/,''))}${c.name?' · '+esc(c.name):''}${c.L?`<span class="g">${esc(c.L.g)} ${esc(c.L.sc)}점</span>`:''}</div><div class="m">${c.L?`<span class="sym">${esc(c.L.sym)}</span>${SYM[c.L.sym]||''}${c.L.rh?` <b>${esc(c.L.rh.split(' (')[0])}</b>`:''} · 최근 적발 ${esc(c.L.yr)} · 미해제 ${typeof c.L.va==='number'?c.L.va+'㎡':esc(c.L.va)}`:`대장 미확인 · ${esc(c.type)} · 사용승인 ${esc(c.date||'미상')}`}${isDone(c)?`<div class="at">배포 완료 ${esc(doneAt(c))}</div>`:''}</div></div><button class="ck" role="checkbox" aria-checked="${isDone(c)}" aria-label="${esc(c.addr)} 배포 완료" data-key="${c.key}"></button></li>`).join('')}</ul>`;
  $('clr').onclick=()=>{curDong=null;selPath=null;renderList();renderDetail();fitGu();};
  $('copy').onclick=async()=>{const txt=L.map(c=>['서울특별시 '+c.addr,c.name,c.type,c.L?c.L.g:'미확인',c.L?c.L.sc:'',c.L?SYM[c.L.sym]||'':'',c.L&&c.L.rh?c.L.rh:'',c.L?c.L.yr:'',isDone(c)?'배포 '+doneAt(c):'미배포'].join('\t')).join('\n');try{await navigator.clipboard.writeText(txt);toast(`${L.length}건을 복사했습니다.`);}catch(e){toast('복사가 막혀 있습니다. 구글시트의 후보 시트를 써 주세요.');}};
  document.querySelectorAll('.seg button').forEach(b=>{b.onclick=()=>{distFilter=b.dataset.f;renderDetail();};});
  document.querySelectorAll('.cand .ck').forEach(b=>{b.onclick=e=>{e.stopPropagation();const c=byKey.get(b.dataset.key);if(c)toggle(c);};b.onkeydown=e=>{e.stopPropagation();};});
  document.querySelectorAll('.cand').forEach(el=>{const go=()=>{const c=byKey.get(el.dataset.key);if(c)focusCand(c,true);};el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go();}};});
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function selectDong(dk){curDong=dk;const d=dongs[dk];selPath=pathOf(i=>BD[i]===dk);closeCard();renderList();renderDetail();follow=false;fit(d.x0,d.y0,d.x1,d.y1,36);}
function setGu(g){curGu=g;store.set('fieldmap-gu',String(g));curDong=null;selPath=null;for(let i=0;i<4;i++)$('gu'+i).setAttribute('aria-selected',g===i);closeCard();renderList();renderDetail();follow=false;loadRegion(regOfGu(g)).then(()=>{if(curGu===g)fitGu();}).catch(()=>{});}
// ---------- 건물 카드 ----------
function closeCard(){selC=null;$('card').style.display='none';draw();}
function focusCand(c,zoom){selC=c;if(zoom){follow=false;const s=Math.max(k,2.2);k=s;tx=W/2-cx[c.b]*k;ty=H/2-cy[c.b]*k;}draw();openCard(c);}
function openCard(c){
  const q=encodeURIComponent('서울특별시 '+c.addr);
  const L=c.L;const el=$('card');el.innerHTML=`<button class="x" aria-label="닫기">×</button>${L?`<span class="pill g${esc(L.g)}" style="background:var(--g${esc(L.g)})">${esc(L.g)}등급 · ${esc(L.sc)}점</span> <span class="note">${L.rk?'전체 '+esc(L.rk)+'위':''}${L.grk?' · 구 '+esc(L.grk)+'위':''}</span>`:`<span class="pill" style="background:var(--unc)">대장 미확인 후보</span>`}<h3>${esc(c.addr)}</h3>${c.name?`<div class="note">${esc(c.name)}</div>`:''}<button class="ckrow" id="cardck"><span class="ck" role="checkbox" aria-checked="${isDone(c)}"></span>배포 완료<span class="when" id="cardwhen">${isDone(c)?esc(doneAt(c)):'아직 안 함'}</span></button>${L?`<dl><dt>소유자 거주</dt><dd><span class="sym">${esc(L.sym)}</span>${SYM[L.sym]||''}</dd>${L.rh?`<dt>거주 호</dt><dd>${esc(L.rh)}</dd>`:''}<dt>최근 적발</dt><dd>${esc(L.yr)}년</dd><dt>미해제 위반</dt><dd>${typeof L.va==='number'?L.va+' ㎡':esc(L.va)}${L.vn?` <span class="note">(${esc(L.vn)})</span>`:''}</dd><dt>위반표시</dt><dd>${esc(L.flag)}</dd>${L.doc?`<dt>확인 대장</dt><dd>${esc(L.doc)}</dd>`:''}</dl><div class="sec"><b>위반 상세</b><p>${esc(L.det)}</p></div><div class="sec"><b>건물 정보 (GIS)</b><p>${esc(c.type)} · 사용승인 ${esc(c.date||'미상')} · 연면적 ${c.area!=null?c.area.toLocaleString()+'㎡':'미상'} · ${c.fl!=null?c.fl+'층':'층수 미상'}</p></div><div class="row" style="margin-top:8px">`:`<dl><dt>추정 유형</dt><dd>${esc(c.type)}</dd><dt>사용승인</dt><dd>${esc(c.date||'미상')}</dd><dt>연면적</dt><dd>${c.area!=null?c.area.toLocaleString()+' ㎡':'미상'}</dd><dt>지상층수</dt><dd>${c.fl!=null?c.fl+'층':'미상'}</dd></dl><div class="row">`}<a href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">네이버지도</a><a href="https://map.kakao.com/?q=${q}" target="_blank" rel="noopener">카카오맵</a></div>`;
  el.querySelector('.x').onclick=closeCard;$('cardck').onclick=()=>toggle(c);
  const x=cx[c.b]*k+tx,y=cy[c.b]*k+ty;el.style.display='block';const w=el.offsetWidth,h=el.offsetHeight;
  el.style.left=Math.min(Math.max(8,x+14),W-w-8)+'px';el.style.top=Math.min(Math.max(8,y-h/2),H-h-8)+'px';
}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200);}
function pip(p,x,y){let s=false;for(let i=0,j=p.length-2;i<p.length;j=i,i+=2){const xi=p[i],yi=p[i+1],xj=p[j],yj=p[j+1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))s=!s;}return s;}
function pick(sx,sy){const wx=(sx-tx)/k,wy=(sy-ty)/k;let best=null,bd=1e9;for(const c of C){const t=catOf(c);if(!show[t])continue;const i=c.b;if(!isLoaded(i))continue;if(wx>=bx0[i]&&wx<=bx1[i]&&wy>=by0[i]&&wy<=by1[i]&&pip(POLY[i],wx,wy))return c;const dx=(cx[i]-wx)*k,dy=(cy[i]-wy)*k,dd=dx*dx+dy*dy;if(dd<bd){bd=dd;best=c;}}return bd<144?best:null;}
// ---------- 손가락·마우스 ----------
const ptrs=new Map();let moved=false,last=null,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});moved=false;last={x:e.offsetX,y:e.offsetY};if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k,tx,ty,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};}cv.classList.add('drag');});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const s=Math.hypot(a.x-b.x,a.y-b.y)/pinch.d;k=pinch.k*s;tx=pinch.mx-(pinch.mx-pinch.tx)*s;ty=pinch.my-(pinch.my-pinch.ty)*s;moved=true;$('card').style.display='none';draw();return;}const dx=e.offsetX-last.x,dy=e.offsetY-last.y;if(Math.abs(dx)+Math.abs(dy)>3){moved=true;follow=false;}tx+=dx;ty+=dy;last={x:e.offsetX,y:e.offsetY};if(moved)$('card').style.display='none';draw();});
function up(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;cv.classList.remove('drag');if(!moved&&e.type==='pointerup'){const c=pick(e.offsetX,e.offsetY);if(c)focusCand(c,false);else closeCard();}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();const s=Math.exp(-e.deltaY*0.0015);zoomAt(e.offsetX,e.offsetY,s);},{passive:false});
function zoomAt(x,y,s){if(follow&&me){x=me.x*k+tx;y=me.y*k+ty;}const nk=Math.min(Math.max(k*s,0.02),20);s=nk/k;k=nk;tx=x-(x-tx)*s;ty=y-(y-ty)*s;$('card').style.display='none';draw();}
$('zin').onclick=()=>zoomAt(W/2,H/2,1.6);$('zout').onclick=()=>zoomAt(W/2,H/2,1/1.6);
$('zfit').onclick=()=>{follow=false;if(curDong!==null){const d=dongs[curDong];fit(d.x0,d.y0,d.x1,d.y1,36);}else fitGu();};
$('tS').onclick=()=>{showSt=!showSt;$('tS').setAttribute('aria-pressed',showSt);draw();};
$('tR').onclick=()=>{showRoad=!showRoad;$('tR').setAttribute('aria-pressed',showRoad);draw();};
for(let i=0;i<4;i++)$('gu'+i).onclick=()=>setGu(i);
[0,1,2,3,4,5].forEach(c=>{const b=$('t'+c);b.onclick=()=>{show[c]=!show[c];b.setAttribute('aria-pressed',show[c]);if(selC&&!show[catOf(selC)])closeCard();renderDetail();draw();};});
new ResizeObserver(resize).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
const r=cv.getBoundingClientRect();W=r.width;H=r.height;
setCands([]);
const g0=+store.get('fieldmap-gu','1');
loadRegion(regOfGu([0,1,2,3].includes(g0)?g0:1)).then(()=>{const l=$('loading');if(l)l.remove();}).catch(()=>{const l=$('loading');if(l)l.textContent='지도 자료를 읽지 못했습니다. 새로고침해 주세요.';});
setGu([0,1,2,3].includes(g0)?g0:1);
sync();
})();
</script>
</body>
